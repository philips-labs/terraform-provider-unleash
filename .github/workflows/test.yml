name: Tests
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  # The Unleash API could drift unexpectedly (like most SaaS systems, etc.), so its recommended testing
  # at a regular interval not necessarily tied to code changes. This will
  # ensure we are alerted to something breaking due to an API change, even if the code did not change.
  schedule:
    - cron: "0 13 * * *"
permissions: {}
jobs:
  # ensure at least the code builds...
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.21
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get dependencies
        run: |
          go mod download

      - name: Build
        run: |
          go build -v .

  # run acceptance tests in a matrix with Terraform core versions
  test:
    name: Matrix Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.12.2"
    steps:
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.21
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 #v4.0.0
        with:
          terraform_version: ${{ matrix.terraform }}

      - name: Start containers
        run: docker compose up -d

      - name: Get dependencies
        run: |
          go mod download

      - name: TF acceptance tests
        timeout-minutes: 10
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_VERSION: ${{ matrix.terraform }}
          UNLEASH_API_URL: http://localhost:4242/api/
          UNLEASH_AUTH_TOKEN: token

        run: |
          go test -v -cover ./internal/provider/

      - name: Stop containers
        if: always()
        run: docker compose down
